<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #container {
      position: relative;
      width: 800px;
      height: 600px;
      border: 1px solid #ccc;
    }

    .tray {
      width: 800px;
      border: 1px solid #aaa;
      padding: 5px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .trayTitle {
      width: 80px;
      font-weight: bold;
    }

    .cell {
      width: 50px;
      height: 50px;
      border: 3px solid red;
      box-sizing: border-box;
      position: absolute;
    }

    .cell.home {
      background: rgba(0, 255, 0, 0.25);
      border-color: green;
    }

    .cell.disabled {
      opacity: 0.3;
    }

    img {
      cursor: grab;
    }

    img.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    #turnIndicator {
      font-size: 18px;
      font-weight: bold;
    }
  </style>

<script>
//global variables
const boxSize = 50;
const gap = 10;
const step = boxSize + gap;
const radius = 120;

// player vars
let currentPlayer = 0;
let numPlayers = 0;

//drag and drop stuff
function dragstartHandler(ev) {
  ev.dataTransfer.setData("text/plain", ev.target.id);
}

function dragoverHandler(ev) {
  ev.preventDefault();
}

function dropHandler(ev) {
  ev.preventDefault();
  if (!ev.target.classList.contains("cell")) return;

  const cell = ev.target;
  const marble = document.getElementById(
    ev.dataTransfer.getData("text/plain")
  );
//whos marbles are whos
  const marblePlayer = marble.dataset.player;
  //whos homespaces are whos
  const cellPlayer = cell.dataset.player;

  // Turn enforcement
  if (parseInt(marblePlayer) !== currentPlayer) return;

  // Home ownership rule
  if (cell.classList.contains("home") && cellPlayer !== marblePlayer) return;

  // Occupied rule
  const occupied = document.querySelector(`img[data-cell="${cell.id}"]`);
  if (occupied && occupied !== marble) return;

  if (marble.parentElement.id !== "container") {
    document.getElementById("container").appendChild(marble);
    marble.style.position = "absolute";
  }

  const cellRect = cell.getBoundingClientRect();
  const contRect = cell.parentElement.getBoundingClientRect();

  marble.style.left = cellRect.left - contRect.left + "px";
  marble.style.top  = cellRect.top  - contRect.top  + "px";
  marble.dataset.cell = cell.id;
}

//rotating U's for star
function rotatePoint(x, y, angleDeg) {
  const rad = angleDeg * Math.PI / 180;
  return {
    x: x * Math.cos(rad) - y * Math.sin(rad),
    y: x * Math.sin(rad) + y * Math.cos(rad)
  };
}

//makeing board spaces/cells
function createCell(id, player, isHome) {
  const d = document.createElement("div");
  d.id = id;
  d.className = "cell";
  if (isHome) d.classList.add("home");
  d.dataset.player = player;
  d.addEventListener("dragover", dragoverHandler);
  d.addEventListener("drop", dropHandler);
  document.getElementById("container").appendChild(d);
}

//making cells and forming them into the arms/u's
function placeU(startIndex, angle, centerX, centerY, player) {
 const grid = [
  // left vertical (5)
  {x:0,y:4},{x:0,y:3},{x:0,y:2},{x:0,y:1},{x:0,y:0},

  // bottom (4)
  {x:1,y:0},{x:2,y:0},{x:3,y:0},{x:4,y:0},

  // right vertical (5)
  {x:4,y:1},{x:4,y:2},{x:4,y:3},{x:4,y:4}
];

  const centered = grid.map(p => ({x:p.x-1,y:p.y-1}));
  const rotated = centered.map(p => rotatePoint(p.x,p.y,angle-90));

  const maxDist = Math.max(...rotated.map(p=>Math.hypot(p.x,p.y))) * step + boxSize/2;
  const rad = angle * Math.PI/180;
  const baseX = centerX + Math.cos(rad)*(radius+maxDist);
  const baseY = centerY + Math.sin(rad)*(radius+maxDist);

  rotated.forEach((p,i)=>{
    const div = document.getElementById("div-"+(startIndex+i));
    div.style.left = baseX + p.x*step + "px";
    div.style.top  = baseY + p.y*step + "px";
  });
}

// makes the board/star
function makeStar() {
  const c = document.getElementById("container");
  c.innerHTML = "";

  numPlayers = parseInt(document.getElementById("numUSelect").value);
  const centerX = 400, centerY = 300;
  const perU = 14;

  for (let i=0;i<numPlayers;i++){
    const start = i*perU;
    for (let j=0;j<perU;j++){
      createCell("div-"+(start+j), i, j===0);
    }
    placeU(start, (360/numPlayers)*i, centerX, centerY, i);
  }
}

//makes the marbles/
function makeMarble(id, src, player) {
  const img = document.createElement("img");
  img.id = id;
  img.src = src;
  img.width = 50;
  img.height = 60;
  img.draggable = true;
  img.style.position = "relative";
  img.dataset.player = player;
  img.dataset.cell = "";
  img.addEventListener("dragstart", dragstartHandler);
  document.getElementById("tray-"+player).appendChild(img);
}

//makes where the marbles start from
function makeTrays() {
  const area = document.getElementById("trays");
  area.innerHTML = "";

  for (let p=0;p<numPlayers;p++){
    const t = document.createElement("div");
    t.className = "tray";
    t.id = "tray-"+p;
    t.innerHTML = `<div class="trayTitle">Player ${p+1}</div>`;
    area.appendChild(t);

    for (let m=0;m<4;m++){
      makeMarble(`marble-${p}-${m}`, `marble ${p+1}.png`, p);
    }
  }
}

// controls whose turn it is and makes it so you can only move youre own marbles.
function updateTurnUI() {
  document.getElementById("turnIndicator").textContent =
    `Current Turn: Player ${currentPlayer + 1}`;

  document.querySelectorAll("img").forEach(img=>{
    img.classList.toggle(
      "disabled",
      parseInt(img.dataset.player) !== currentPlayer
    );
  });
}
// swaps which plaeyer it is.
function endTurn() {
  currentPlayer = (currentPlayer + 1) % numPlayers;
  updateTurnUI();
}
 

// rolls the dice
  function rollDice() {
  const img = document.getElementById("DICE");
  const randomNumber = Math.floor(Math.random() * 6) + 1;

  switch (randomNumber) {
    case 1:
      img.src = "dice one side.png";
      break;
    case 2:
      img.src = "dice two side.png";
      break;
    case 3:
      img.src = "dice three side.png";
      break;
    case 4:
      img.src = "four side dice.png";
      break;
    case 5:
      img.src = "dice five side.png";
      break;
    case 6:
      img.src = "dice six side.png";
      break;
    default:
      console.log("Not valid");
  }
}


// ran when you click the button, makes everything for the game
function finalBoard() {
  currentPlayer = 0;
  makeStar();
  makeTrays();
  updateTurnUI();
}


</script>
</head>

<body>

  <div id="container"></div>

  <div id="trays"></div>

  <div id="turnIndicator"></div>

  <label>Number of Players:</label>
  <select id="numUSelect">
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6" selected>6</option>
  </select>
<button onclick="rollDice()">Roll Dice</button>
  <button onclick="finalBoard()">Create Board</button>
  <button onclick="endTurn()">End Turn</button>
  <img id= "DICE" src="dice one side.png" alt="DICE" width="300" height="200">

</body>
</html>
