<!DOCTYPE html>
<html>
<head>
  <style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

#container {
  position: relative;
  min-height: 400px;
  width: auto;
}

  
</style>
  <script>
    // global variables
 
    let boardIndex = 0;

    const boardsPerCircle = 6;   // 6-point star (change to 4, 8, etc)

    const radius = 180;          // distance from center

  //  let containerRightEdge = 0;
    //drag and drop stuff start
function dragstartHandler(ev) {
  ev.dataTransfer.setData("text", ev.target.id);
}

function dragoverHandler(ev) {
  ev.preventDefault();
}

function dropHandler(ev) {
  ev.preventDefault();
  const data = ev.dataTransfer.getData("text");
  ev.target.appendChild(document.getElementById(data));
}
    //drag and drop stuff end
    //dice
function rollDice() {
      const diceFaces = ["dice one side.png", "dice two side.png", "dice three side.png", "four side dice.png", "dice five side.png", "dice six side.png"];
      const randomIndex = Math.floor(Math.random() * 6);
      document.getElementById("dice").src = diceFaces[randomIndex];
    }
//spaces stuff start
    function placeDiv(x_pos, y_pos, divname) {
  var d = document.getElementById(divname);
  d.style.position = "absolute";
  d.style.left = x_pos+'px';
  d.style.top = y_pos+'px';
}
function createAndAddDiv(divnum) {
  const newDiv = document.createElement("div");
  newDiv.id = "div-" + divnum;

  newDiv.style.width = "50px";
newDiv.style.height = "50px";
newDiv.style.border = "3px solid red";
newDiv.style.boxSizing = "border-box";

  newDiv.addEventListener("drop", dropHandler);
  newDiv.addEventListener("dragover", dragoverHandler);

  const container = document.getElementById("container");
  container.appendChild(newDiv);
}
  function placeDivsInSquare(totalDivs, boxSize = 50, gap = 10) {
  const cols = Math.ceil(Math.sqrt(totalDivs));
//SIX SEVEN!!!!!!!!!!!!!!!!!!!!!!!!!
  for (let i = 0; i < totalDivs; i++) {
    const div = document.getElementById("div-" + i);

    const row = Math.floor(i / cols);
    const col = i % cols;

    div.style.position = "absolute";
    div.style.left = (col * (boxSize + gap)) + "px";
    div.style.top = (row * (boxSize + gap)) + "px";
  }
}
    function rotatePoint(x, y, rotation) {
  switch (rotation) {
    case 90:  return { x: -y, y: x };
    case 180: return { x: -x, y: -y };
    case 270: return { x: y, y: -x };
    default:  return { x, y }; // 0°
  }
}

function placeDivsInU(
  totalDivs,
  startIndex,
  rotation = 0,
  boxSize = 50,
  gap = 10,
  offsetX = 0
) {
  const step = boxSize + gap;

  // Fixed 7-square U
  const positions = [
    // bottom row
    { x: 0, y: 2 },
    { x: 1, y: 2 },
    { x: 2, y: 2 },

    // left column
    { x: 0, y: 1 },
    { x: 0, y: 0 },

    // right column
    { x: 2, y: 1 },
    { x: 2, y: 0 }
  ];

  // Rotate
  const rotated = positions.map(p => rotatePoint(p.x, p.y, rotation));

  // Normalize
  const minX = Math.min(...rotated.map(p => p.x));
  const minY = Math.min(...rotated.map(p => p.y));

  let maxX = 0;

  rotated.forEach((p, index) => {
    const div = document.getElementById("div-" + (startIndex + index));

    const left = offsetX + (p.x - minX) * step;
    const top  = (p.y - minY) * step;

    div.style.position = "absolute";
    div.style.left = left + "px";
    div.style.top  = top + "px";

    maxX = Math.max(maxX, left + boxSize);
  });

  return maxX;
}
function getStarPlacement(index) {
  const angle = (360 / boardsPerCircle) * index;
  const radians = angle * Math.PI / 180;

  const centerX = 400;
  const centerY = 200;

  return {
    x: centerX + Math.cos(radians) * radius,
    y: centerY + Math.sin(radians) * radius,
    rotation: (angle + 90) % 360


  };
}



function makeBoard() {
  const total = 7;
  const container = document.getElementById("container");

  const startIndex = boardIndex * total;

  // create squares
  for (let p = 0; p < total; p++) {
    createAndAddDiv(startIndex + p);
  }

  // star placement
  const placement = getStarPlacement(boardIndex);

  placeDivsInU(total, startIndex, placement.rotation, 50, 10, placement.x  );

  // vertical offset
  for (let i = 0; i < total; i++) {
    const div = document.getElementById("div-" + (startIndex + i));
    div.style.top =
      parseFloat(div.style.top) + placement.y + "px";
  }

  boardIndex++;
}


  
  
   

//spaces stuff end
</script>
<title>Page Title</title>
</head>
  
<body>

  <div id="container"></div>
<img id="img1" src="Screenshot 2025-09-15 124215.png" draggable="true" ondragstart="dragstartHandler(event)" width="50" height="60">
<img id="dice" src="dice six side.png" width="100" height="100">
<button onclick="makeBoard()" > set Board </button>
<button onclick="rollDice()">Roll Die</button>

  
</body>
</html>
