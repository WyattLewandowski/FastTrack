<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #container {
      position: relative;
      width: 800px;
      height: 600px;
      border: 1px solid #ccc;
    }

    .cell {
      width: 50px;
      height: 50px;
      border: 3px solid red;
      box-sizing: border-box;
      position: absolute;
    }
  </style>

  <script>
    let boardIndex = 0;

    const boardsPerCircle = 8;
    const baseRadius = 180;
    const boxSize = 50;
    const gap = 10;
    const step = boxSize + gap;

    /* ---------- Drag & Drop ---------- */

    function dragstartHandler(ev) {
      ev.dataTransfer.setData("text", ev.target.id);
    }

    function dragoverHandler(ev) {
      ev.preventDefault();
    }

    function dropHandler(ev) {
      ev.preventDefault();
      const data = ev.dataTransfer.getData("text");
      ev.target.appendChild(document.getElementById(data));
    }

    /* ---------- Geometry ---------- */

    function rotatePoint(x, y, angleDeg) {
      const rad = angleDeg * Math.PI / 180;
      return {
        x: x * Math.cos(rad) - y * Math.sin(rad),
        y: x * Math.sin(rad) + y * Math.cos(rad)
      };
    }

    /* ---------- Create Cells ---------- */

    function createCell(id) {
      const d = document.createElement("div");
      d.id = id;
      d.className = "cell";
      d.addEventListener("dragover", dragoverHandler);
      d.addEventListener("drop", dropHandler);
      document.getElementById("container").appendChild(d);
    }

    /* ---------- Place U ---------- */

    function placeU(startIndex, angleDeg, centerX, centerY) {

      // U shape in grid space
      const grid = [
        { x: 0, y: 2 }, { x: 1, y: 2 }, { x: 2, y: 2 },
        { x: 0, y: 1 }, { x: 0, y: 0 },
        { x: 2, y: 1 }, { x: 2, y: 0 }
      ];

      // Center grid around (0,0)
      const centered = grid.map(p => ({
        x: p.x - 1,
        y: p.y - 1
      }));

      // Rotate toward CENTER (angle + 90)
      const rotated = centered.map(p =>
        rotatePoint(p.x, p.y, angleDeg + 90)
      );

      // Compute bounding radius of rotated U
      const maxDist =
        Math.max(...rotated.map(p => Math.hypot(p.x, p.y))) * step +
        boxSize / 2;

      // Position center of U on star
      const rad = angleDeg * Math.PI / 180;
      const baseX = centerX + Math.cos(rad) * (baseRadius + maxDist);
      const baseY = centerY + Math.sin(rad) * (baseRadius + maxDist);

      // Place cells
      rotated.forEach((p, i) => {
        const div = document.getElementById("div-" + (startIndex + i));
        div.style.left = baseX + p.x * step + "px";
        div.style.top  = baseY + p.y * step + "px";
      });
    }

    /* ---------- Board ---------- */

    function makeBoard() {
      const total = 7;
      const startIndex = boardIndex * total;

      for (let i = 0; i < total; i++) {
        createCell("div-" + (startIndex + i));
      }

      const angle = (360 / boardsPerCircle) * boardIndex;
      const centerX = 400;
      const centerY = 300;

      placeU(startIndex, angle, centerX, centerY);
      boardIndex++;
    }
  </script>
</head>

<body>
  <div id="container"></div>

  <img
    id="img1"
    src="Screenshot 2025-09-15 124215.png"
    draggable="true"
    ondragstart="dragstartHandler(event)"
    width="50"
    height="60"
  >

  <button onclick="makeBoard()">Set Board</button>
</body>
</html>
