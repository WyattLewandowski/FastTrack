<!DOCTYPE html>
<html>
<head>
  <style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #container {
    position: relative; /* IMPORTANT */
    width: 400px;       /* enough space for the square */
    height: 400px;
  }
  
</style>
  <script>
    //drag and drop stuff start
function dragstartHandler(ev) {
  ev.dataTransfer.setData("text", ev.target.id);
}

function dragoverHandler(ev) {
  ev.preventDefault();
}

function dropHandler(ev) {
  ev.preventDefault();
  const data = ev.dataTransfer.getData("text");
  ev.target.appendChild(document.getElementById(data));
}
    //drag and drop stuff end
    //dice
function rollDice() {
      const diceFaces = ["dice one side.png", "dice two side.png", "dice three side.png", "four side dice.png", "dice five side.png", "dice six side.png"];
      const randomIndex = Math.floor(Math.random() * 6);
      document.getElementById("dice").src = diceFaces[randomIndex];
    }
//spaces stuff start
    function placeDiv(x_pos, y_pos, divname) {
  var d = document.getElementById(divname);
  d.style.position = "absolute";
  d.style.left = x_pos+'px';
  d.style.top = y_pos+'px';
}
function createAndAddDiv(divnum) {
  const newDiv = document.createElement("div");
  newDiv.id = "div-" + divnum;

  newDiv.style.height = "50px";
  newDiv.style.width = "50px";
  newDiv.style.padding = "10px";
  newDiv.style.border = "3px solid red";
  newDiv.style.display = "inline-block";

  newDiv.addEventListener("drop", dropHandler);
  newDiv.addEventListener("dragover", dragoverHandler);

  const container = document.getElementById("container");
  container.appendChild(newDiv);
}
  function placeDivsInSquare(totalDivs, boxSize = 50, gap = 10) {
  const cols = Math.ceil(Math.sqrt(totalDivs));

  for (let i = 0; i < totalDivs; i++) {
    const div = document.getElementById("div-" + i);

    const row = Math.floor(i / cols);
    const col = i % cols;

    div.style.position = "absolute";
    div.style.left = (col * (boxSize + gap)) + "px";
    div.style.top = (row * (boxSize + gap)) + "px";
  }
}
    function placeDivsInU(
  totalDivs,
  rotation = 0,
  boxSize = 50,
  gap = 10,
  bottomCount = 4
) {
  const step = boxSize + gap;
  const positions = [];

  // --- Base U (opens UP, rotation = 0) ---
  let index = 0;

  // Bottom row (left → right)
  for (let i = 0; i < bottomCount && index < totalDivs; i++, index++) {
    positions.push({ x: i, y: 2 });
  }

  // Right column (bottom → top)
  const verticalCount = Math.ceil((totalDivs - index) / 2);
  for (let i = 1; i <= verticalCount && index < totalDivs; i++, index++) {
    positions.push({ x: bottomCount - 1, y: 2 - i });
  }

  // Top row (right → left)
  for (let i = bottomCount - 2; i >= 0 && index < totalDivs; i--, index++) {
    positions.push({ x: i, y: 0 });
  }

  // --- Apply rotation ---
  const rotated = positions.map(p => rotatePoint(p.x, p.y, rotation));

  // --- Normalize to positive coords ---
  const minX = Math.min(...rotated.map(p => p.x));
  const minY = Math.min(...rotated.map(p => p.y));

  rotated.forEach((p, i) => {
    const div = document.getElementById("div-" + i);
    div.style.left = ((p.x - minX) * step) + "px";
    div.style.top = ((p.y - minY) * step) + "px";
  });
}
function rotatePoint(x, y, r) {
  switch (r % 4) {
    case 1: return { x: y, y: -x };   // 90°
    case 2: return { x: -x, y: -y };  // 180°
    case 3: return { x: -y, y: x };   // 270°
    default: return { x, y };         // 0°
  }
}

function makeBoard() {
  const total = 10;

  
  const container = document.getElementById("container");
  container.innerHTML = "";

  for (let p = 0; p < total; p++) {
    createAndAddDiv(p);
  }

  
  
   
 placeDivsInU(10,1);
}

//spaces stuff end
</script>

</head>
  
<body>

<img id="img1" src="Screenshot 2025-09-15 124215.png" draggable="true" ondragstart="dragstartHandler(event)" width="50" height="60">
<img id="dice" src="dice six side.png" width="100" height="100">
<button onclick="makeBoard()" > set Board </button>
<button onclick="rollDice()">Roll Die</button>

  
</body>
</html>
