<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }

    #container {
      position: relative;
      width: 800px;
      height: 600px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
    }

    .cell {
      width: 50px;
      height: 50px;
      border: 3px solid red;
      box-sizing: border-box;
      position: absolute;
    }
  </style>

  <script>
    const boxSize = 50;
    const gap = 10;
    const step = boxSize + gap;
    const radius = 180; // fixed radius of the star

    /* ---------- Drag & Drop ---------- */
    function dragstartHandler(ev) {
      ev.dataTransfer.setData("text", ev.target.id);
    }

    function dragoverHandler(ev) {
      ev.preventDefault();
    }

    function dropHandler(ev) {
      ev.preventDefault();
      const data = ev.dataTransfer.getData("text");
      ev.target.appendChild(document.getElementById(data));
    }

    /* ---------- Geometry ---------- */
    function rotatePoint(x, y, angleDeg) {
      const rad = angleDeg * Math.PI / 180;
      return {
        x: x * Math.cos(rad) - y * Math.sin(rad),
        y: x * Math.sin(rad) + y * Math.cos(rad)
      };
    }

    /* ---------- Create Cell ---------- */
    function createCell(id) {
      const d = document.createElement("div");
      d.id = id;
      d.className = "cell";
      d.addEventListener("dragover", dragoverHandler);
      d.addEventListener("drop", dropHandler);
      document.getElementById("container").appendChild(d);
    }

    /* ---------- Place a single U ---------- */
    function placeU(startIndex, angleDeg, centerX, centerY) {
      const grid = [
        { x: 0, y: 2 }, { x: 1, y: 2 }, { x: 2, y: 2 },
        { x: 0, y: 1 }, { x: 0, y: 0 },
        { x: 2, y: 1 }, { x: 2, y: 0 }
      ];

      const centered = grid.map(p => ({
        x: p.x - 1,
        y: p.y - 1
      }));

      // Rotate so TOP of U faces center
      const rotated = centered.map(p =>
        rotatePoint(p.x, p.y, angleDeg - 90)
      );

      const maxDist = Math.max(...rotated.map(p => Math.hypot(p.x, p.y))) * step + boxSize/2;

      const rad = angleDeg * Math.PI / 180;
      const baseX = centerX + Math.cos(rad) * (radius + maxDist);
      const baseY = centerY + Math.sin(rad) * (radius + maxDist);

      rotated.forEach((p, i) => {
        const div = document.getElementById("div-" + (startIndex + i));
        div.style.left = baseX + p.x * step + "px";
        div.style.top  = baseY + p.y * step + "px";
      });
    }

    /* ---------- Make Star ---------- */
    function makeStar() {
      const container = document.getElementById("container");
      container.innerHTML = ""; // clear old star

      const numU = parseInt(document.getElementById("numUSelect").value);
      const centerX = 400;
      const centerY = 300;
      const totalPerU = 7;

      for (let i = 0; i < numU; i++) {
        const startIndex = i * totalPerU;
        for (let j = 0; j < totalPerU; j++) {
          createCell("div-" + (startIndex + j));
        }

        const angle = (360 / numU) * i;
        placeU(startIndex, angle, centerX, centerY);
      }
    }
  </script>
</head>

<body>
  <div id="container"></div>

  <label for="numUSelect">Number of U's in Star: </label>
  <select id="numUSelect">
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6" selected>6</option>
    <option value="7">7</option>
    <option value="8">8</option>
    <option value="10">10</option>
  </select>

  <button onclick="makeStar()">Create Star</button>

  <p>Drag the image or squares onto the U's cells.</p>
  <img
    id="img1"
    src="Screenshot 2025-09-15 124215.png"
    draggable="true"
    ondragstart="dragstartHandler(event)"
    width="50"
    height="60"
  >
</body>
</html>
