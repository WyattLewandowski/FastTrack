<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #container {
      position: relative;
      width: 800px;
      height: 600px;
      border: 1px solid #ccc;
    }
  </style>

  <script>
    let boardIndex = 0;

    const boardsPerCircle = 8;
    const baseRadius = 180;

    function rotatePoint(x, y, angleDeg) {
      const rad = angleDeg * Math.PI / 180;
      return {
        x: x * Math.cos(rad) - y * Math.sin(rad),
        y: x * Math.sin(rad) + y * Math.cos(rad)
      };
    }

    function createAndAddDiv(id) {
      const d = document.createElement("div");
      d.id = id;
      d.style.width = "50px";
      d.style.height = "50px";
      d.style.border = "3px solid red";
      d.style.boxSizing = "border-box";
      d.style.position = "absolute";
      document.getElementById("container").appendChild(d);
    }

    function placeDivsInU(startIndex, rotationDeg, centerX, centerY) {
      const boxSize = 50;
      const gap = 10;
      const step = boxSize + gap;

      // U shape (local grid)
      const positions = [
        { x: 0, y: 2 }, { x: 1, y: 2 }, { x: 2, y: 2 },
        { x: 0, y: 1 }, { x: 0, y: 0 },
        { x: 2, y: 1 }, { x: 2, y: 0 }
      ];

      // Center grid at origin BEFORE rotation
      const centered = positions.map(p => ({
        x: p.x - 1,
        y: p.y - 1
      }));

      // Rotate
      const rotated = centered.map(p => rotatePoint(p.x, p.y, rotationDeg));

      // Compute bounding radius (for perfect spacing)
      const maxDist = Math.max(
        ...rotated.map(p => Math.hypot(p.x, p.y))
      ) * step + boxSize / 2;

      // Final placement radius
      const angleRad = rotationDeg * Math.PI / 180;
      const finalX = centerX + Math.cos(angleRad) * (baseRadius + maxDist);
      const finalY = centerY + Math.sin(angleRad) * (baseRadius + maxDist);

      // Place divs
      rotated.forEach((p, i) => {
        const div = document.getElementById("div-" + (startIndex + i));
        div.style.left = finalX + p.x * step + "px";
        div.style.top  = finalY + p.y * step + "px";
      });
    }

    function makeBoard() {
      const total = 7;
      const startIndex = boardIndex * total;

      for (let i = 0; i < total; i++) {
        createAndAddDiv("div-" + (startIndex + i));
      }

      const angle = (360 / boardsPerCircle) * boardIndex;
      const centerX = 400;
      const centerY = 300;

      placeDivsInU(startIndex, angle + 270, centerX, centerY);

      boardIndex++;
    }
  </script>
</head>

<body>

  <div id="container"></div>
<img id="img1" src="Screenshot 2025-09-15 124215.png" draggable="true" ondragstart="dragstartHandler(event)" width="50" height="60">
<img id="dice" src="dice six side.png" width="100" height="100">
<button onclick="makeBoard()" > set Board </button>


  
</body>
</html>
