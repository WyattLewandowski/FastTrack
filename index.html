<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }

    #container {
      position: relative;
      width: 800px;
      height: 600px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
    }


    .cell {
      width: 50px;
      height: 50px;
      border: 3px solid red;
      box-sizing: border-box;
      position: absolute;
    }
    .cell.green {
  border-color: green;
  background: rgba(0, 255, 0, 0.2);
}

  </style>

 <script>
/* ---------- Constants ---------- */
const boxSize = 50;
const gap = 10;
const step = boxSize + gap;
const radius = 180;

/* ---------- Drag & Drop ---------- */
function dragstartHandler(ev) {
  ev.dataTransfer.setData("text/plain", ev.target.id);
}

function dragoverHandler(ev) {
  ev.preventDefault();
}
function dropHandler(ev) {
  ev.preventDefault();

  if (!ev.target.classList.contains("cell")) return;

  const cell = ev.target;
  const marbleId = ev.dataTransfer.getData("text/plain");
  const marble = document.getElementById(marbleId);

  // ❌ If cell already has a marble, block drop
  const occupied = document.querySelector(
    `img[data-cell="${cell.id}"]`
  );
  if (occupied && occupied !== marble) return;

  const cellRect = cell.getBoundingClientRect();
  const containerRect = cell.parentElement.getBoundingClientRect();

  marble.style.left = cellRect.left - containerRect.left + "px";
  marble.style.top  = cellRect.top  - containerRect.top  + "px";

  // 🧠 Update marble's occupied cell
  marble.dataset.cell = cell.id;
}

/* ---------- Geometry ---------- */
function rotatePoint(x, y, angleDeg) {
  const rad = angleDeg * Math.PI / 180;
  return {
    x: x * Math.cos(rad) - y * Math.sin(rad),
    y: x * Math.sin(rad) + y * Math.cos(rad)
  };
}

/* ---------- Create Cell ---------- */
function createCell(id) {
  const d = document.createElement("div");
  d.id = id;
  d.className = "cell";
  d.addEventListener("dragover", dragoverHandler);
  d.addEventListener("drop", dropHandler);
  document.getElementById("container").appendChild(d);
}

/* ---------- Place a U ---------- */
function placeU(startIndex, angleDeg, centerX, centerY) {
  const grid = [
    { x: 0, y: 2 }, { x: 1, y: 2 }, { x: 2, y: 2 },
    { x: 0, y: 1 },
    { x: 0, y: 0 }, // <-- top-left of U
    { x: 2, y: 1 }, { x: 2, y: 0 }
  ];

  const centered = grid.map(p => ({
    x: p.x - 1,
    y: p.y - 1
  }));

  const rotated = centered.map(p =>
    rotatePoint(p.x, p.y, angleDeg - 90)
  );

  const maxDist =
    Math.max(...rotated.map(p => Math.hypot(p.x, p.y))) * step +
    boxSize / 2;

  const rad = angleDeg * Math.PI / 180;
  const baseX = centerX + Math.cos(rad) * (radius + maxDist);
  const baseY = centerY + Math.sin(rad) * (radius + maxDist);

  rotated.forEach((p, i) => {
    const div = document.getElementById("div-" + (startIndex + i));

    div.style.left = baseX + p.x * step + "px";
    div.style.top  = baseY + p.y * step + "px";

    // ✅ color the bottom-left cell green
    if (grid[i].x === 0 && grid[i].y === 2) {
      div.classList.add("green");
    }
  });
}


/* ---------- Make Star ---------- */
function makeStar() {
  const container = document.getElementById("container");
  container.innerHTML = "";

  const numU = parseInt(document.getElementById("numUSelect").value);
  const centerX = 400;
  const centerY = 300;
  const totalPerU = 7;

  for (let i = 0; i < numU; i++) {
    const startIndex = i * totalPerU;

    for (let j = 0; j < totalPerU; j++) {
      createCell("div-" + (startIndex + j));
    }

    placeU(startIndex, (360 / numU) * i, centerX, centerY);
  }
}

/* ---------- Make Marble (WORKING) ---------- */
function makeMarble(id, src, x, y) {
  const img = document.createElement("img");

  img.id = id;
  img.src = src;
  img.width = 50;
  img.height = 60;
  img.draggable = true;

  img.style.position = "absolute";
  img.style.left = x + "px";
  img.style.top  = y + "px";

  img.dataset.cell = ""; // <-- track occupied cell

  img.addEventListener("dragstart", dragstartHandler);

  document.getElementById("container").appendChild(img);
}

/* ---------- Final Board (WORKING) ---------- */
function finalBoard() {
  makeStar();

  const numPlayers = parseInt(document.getElementById("numUSelect").value);
  let marbleCount = 0;

  const startX = 50;
  const startY = 520;
  const spacing = 60;

  for (let p = 0; p < numPlayers; p++) {
    for (let m = 0; m < 4; m++) {
      makeMarble(
        "marble-" + marbleCount,
        "marble " + (p + 1) + ".png",
        startX + marbleCount * spacing,
        startY
      );
      marbleCount++;
    }
  }
}
</script>

</head>

<body>
  <div id="container"></div>

  <label for="numUSelect">Number of U's in Star: </label>
  <select id="numUSelect">
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6" selected>6</option>
    <option value="7">7</option>
    <option value="8">8</option>
    <option value="10">10</option>
  </select>

  <button onclick="finalBoard()">Create Board</button>
  
</body>
</html>
