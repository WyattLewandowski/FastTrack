function dragstartHandler(ev) {
  ev.dataTransfer.setData("text", ev.target.id);
}

function dragoverHandler(ev) {
  ev.preventDefault();
}

function dropHandler(ev) {
  ev.preventDefault();
  const data = ev.dataTransfer.getData("text");
  ev.target.appendChild(document.getElementById(data));
}

function createAndAddDiv(divnum) {
  const newDiv = document.createElement("div");
  newDiv.id = "div-" + divnum;

  newDiv.style.width = "50px";
newDiv.style.height = "50px";
newDiv.style.border = "3px solid red";

}
  function placeDivsInSquare(totalDivs, boxSize = 50, gap = 10) {
  const cols = Math.ceil(Math.sqrt(totalDivs));
//SIX SEVEN!!!!!!!!!!!!!!!!!!!!!!!!!
  for (let i = 0; i < totalDivs; i++) {
    const div = document.getElementById("div-" + i);

    const row = Math.floor(i / cols);
    const col = i % cols;

    div.style.position = "absolute";
    div.style.left = (col * (boxSize + gap)) + "px";
    div.style.top = (row * (boxSize + gap)) + "px";
  }
}
function rotatePoint(x, y, angleDeg) {
  const rad = angleDeg * Math.PI / 180;
  return {
    x: x * Math.cos(rad) - y * Math.sin(rad),
    y: x * Math.sin(rad) + y * Math.cos(rad)
  };
}


function placeDivsInU(
  totalDivs,
  startIndex,
  rotationDeg,
  boxSize = 50,
  gap = 10,
  centerX = 0,
  centerY = 0
) {
  const step = boxSize + gap;

  // Fixed 7-square U
  const positions = [
    // bottom row
    { x: 0, y: 2 },
    { x: 1, y: 2 },
    { x: 2, y: 2 },

    // left column
    { x: 0, y: 1 },
    { x: 0, y: 0 },

    // right column
    { x: 2, y: 1 },
    { x: 2, y: 0 }
  ];

  // Compute center of the U
  const uCenterX = (Math.max(...positions.map(p => p.x)) + Math.min(...positions.map(p => p.x))) / 2;
  const uCenterY = (Math.max(...positions.map(p => p.y)) + Math.min(...positions.map(p => p.y))) / 2;

  positions.forEach((p, index) => {
    // Rotate around the U's center
    const dx = p.x - uCenterX;
    const dy = p.y - uCenterY;

    const rad = rotationDeg * Math.PI / 180;
    const rx = dx * Math.cos(rad) - dy * Math.sin(rad);
    const ry = dx * Math.sin(rad) + dy * Math.cos(rad);

    const div = document.getElementById("div-" + (startIndex + index));
    div.style.position = "absolute";
    div.style.left = centerX + rx * step + "px";
    div.style.top  = centerY + ry * step + "px";
  });
}

function makeBoard() {
  const total = 7;
  const container = document.getElementById("container");
  const startIndex = boardIndex * total;

  // create squares
  for (let p = 0; p < total; p++) {

  }

  // star placement
  const placement = getStarPlacement(boardIndex);

  // Calculate angle toward center
  const centerX = 400;
  const centerY = 200;
  const dx = centerX - placement.x;
  const dy = centerY - placement.y;
  const angleDeg = Math.atan2(dy, dx) * 180 / Math.PI;

  placeDivsInU(total, startIndex, angleDeg, 50, 10, placement.x, placement.y);

  boardIndex++;
}
